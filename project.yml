name: Kaxiang
options:
  bundleIdPrefix: com.suchuan
  deploymentTarget:
    iOS: "15.0"
  minimumXcodeGenVersion: "2.0"
targets:
  Kaxiang:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        NSCameraUsageDescription: 需要用摄像头实时抠出人像并更换背景
        NSPhotoLibraryAddUsageDescription: 需要把拍好的照片存进相册
        CFBundleDisplayName: 抠像相机
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suchuan.kaxiang
        PRODUCT_NAME: Kaxiang
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
      build:
        targets:
          Kaxiang: all
