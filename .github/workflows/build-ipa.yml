name: BuildIPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project Kaxiang.xcodeproj -scheme Kaxiang -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
      - name: Package ipa
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kaxiang.app Payload/
          zip -qr Kaxiang.ipa Payload
          ls -lh Kaxiang.ipa
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kaxiang-ipa
          path: Kaxiang.ipa
      - name: Commit outputs
        if: always()
        run: |
          mkdir -p out
          if [ -f build.log ]; then cp build.log out/build.log; else echo "no build log" > out/build.log; fi
          if [ -f Kaxiang.ipa ]; then cp Kaxiang.ipa out/Kaxiang.ipa; fi
          git config user.name "ipa-bot"
          git config user.email "ipa-bot@users.noreply.github.com"
          git add -f out
          git commit -m "build output" || true
          git push || true
